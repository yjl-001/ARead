<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARead Product Intro</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0a0f14;
        overflow: hidden;
        font-family: Inter, "Avenir Next", "Helvetica Neue", Arial, sans-serif;
      }

      [data-composition-id="aread-product-intro"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0f14;
        color: #f7f4ea;
      }

      .video-frame {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: #0a0f14;
      }

      .video-frame video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.02);
      }

      .shade {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(90deg, rgba(10, 15, 20, 0.78) 0%, rgba(10, 15, 20, 0.5) 42%, rgba(10, 15, 20, 0.16) 100%),
          radial-gradient(circle at 30% 50%, rgba(137, 180, 255, 0.22) 0%, rgba(137, 180, 255, 0) 36%);
      }

      .scene-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        padding: 132px 160px;
        gap: 34px;
      }

      .eyebrow {
        width: max-content;
        max-width: 760px;
        padding: 12px 18px;
        border: 1px solid rgba(247, 244, 234, 0.22);
        border-radius: 999px;
        background: rgba(10, 15, 20, 0.34);
        color: #d7e7c6;
        font-size: 30px;
        line-height: 1;
        font-weight: 600;
      }

      .title {
        margin: 0;
        color: #f7f4ea;
        font-size: 164px;
        line-height: 0.92;
        font-weight: 760;
        letter-spacing: 0;
        text-wrap: balance;
        max-width: 1040px;
        text-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      }

      .subtitle {
        margin: 0;
        max-width: 820px;
        color: rgba(247, 244, 234, 0.86);
        font-size: 42px;
        line-height: 1.2;
        font-weight: 500;
      }

      .accent-line {
        width: 176px;
        height: 5px;
        border-radius: 999px;
        background: linear-gradient(90deg, #89b4ff, #d7e7c6);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="aread-product-intro"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
      data-track-index="0"
    >
      <div class="video-frame" data-layout-ignore>
        <video
          id="background-video"
          data-start="0"
          data-duration="10"
          data-track-index="0"
          src="../media/aread_background_video.mp4"
          muted
          playsinline
        ></video>
      </div>

      <audio
        id="background-music"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        src="../media/aread_background_music.m4a"
        data-volume="0.86"
      ></audio>

      <div class="shade" data-layout-ignore></div>

      <section class="scene-content">
        <div class="eyebrow">Reading workspace</div>
        <h1 class="title">ARead</h1>
        <div class="accent-line"></div>
        <p class="subtitle">Read deeply. Connect ideas. Move from paper to insight.</p>
      </section>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const tl = gsap.timeline({ paused: true });

        tl.from(".video-frame", { opacity: 0, scale: 1.04, duration: 1.2, ease: "power2.out" }, 0);
        tl.from(".shade", { opacity: 0, duration: 1.4, ease: "power2.out" }, 0.1);
        tl.from(".eyebrow", { opacity: 0, y: 28, duration: 0.7, ease: "power3.out" }, 0.7);
        tl.from(".title", { opacity: 0, y: 44, duration: 0.9, ease: "power3.out" }, 1.0);
        tl.from(".accent-line", { opacity: 0, scaleX: 0.12, duration: 0.7, ease: "power3.out" }, 1.45);
        tl.from(".subtitle", { opacity: 0, y: 30, duration: 0.75, ease: "power3.out" }, 1.7);

        tl.to(".scene-content", { opacity: 0, y: -24, duration: 0.7, ease: "power2.in" }, 8.7);
        tl.to(".shade", { opacity: 0.34, duration: 0.8, ease: "power2.inOut" }, 8.8);

        window.__timelines["aread-product-intro"] = tl;
      </script>
    </div>
  </body>
</html>
